name: Build Release

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      full_rebuild:
        description: "Rebuild and re-upload every asset pack (slow, for recovery)"
        type: boolean
        default: false

# Runs queue instead of racing each other's pushes and uploads. Each run
# processes everything since the last successful one (scripts/last_tag.txt).
concurrency:
  group: update-assets
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-assets:
    name: Update Assets
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FULL_REBUILD: ${{ inputs.full_rebuild == true }}
    steps:
      - name: Free disk space (full rebuild only)
        if: env.FULL_REBUILD == 'true'
        uses: mathio/gha-cleanup@v1
        with:
          remove-browsers: true
          verbose: true

      # Blobless sparse checkout of the latest main: scripts, root files and
      # pack configs only. Changed packs are added once we know which they are.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /scripts/
            /games/*/*/config.json
            /games/*/base_files/icon/config.json

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install python packages
        run: pip install pillow

      - name: Detect changed packs
        id: changes
        run: |
          git fetch --no-tags --depth=1 --filter=blob:none origin "$(cat scripts/last_tag.txt)"
          python scripts/asset_changes.py \
            --output "$RUNNER_TEMP/changes.json" \
            --sparse-patterns "$RUNNER_TEMP/sparse.txt"

      - name: Checkout changed packs
        if: steps.changes.outputs.has_changes == 'true' && env.FULL_REBUILD != 'true'
        run: git sparse-checkout add --stdin < "$RUNNER_TEMP/sparse.txt"

      - name: Checkout all packs (full rebuild only)
        if: env.FULL_REBUILD == 'true'
        run: git sparse-checkout disable

      - name: Optimize images
        if: steps.changes.outputs.has_png == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq optipng
          python scripts/optimize.py --changes "$RUNNER_TEMP/changes.json"

      - name: Update pack metadata
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          python scripts/image_metadata.py --changes "$RUNNER_TEMP/changes.json"
          python scripts/small_logo.py --changes "$RUNNER_TEMP/changes.json"
          python scripts/update_calver.py --changes "$RUNNER_TEMP/changes.json"

      # last_tag.txt points at this commit, so the next run doesn't see these
      # edits as new changes.
      - name: Commit pack metadata
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config --global user.name 'Buildbot'
          git config --global user.email 'buildbot@users.noreply.github.com'
          git add -A -- games
          if ! git diff --cached --quiet; then
            git commit -m "Update images and metadata of changed packs"
          fi

      - name: Build archives
        if: steps.changes.outputs.has_changes == 'true' || env.FULL_REBUILD == 'true'
        run: |
          if [ "$FULL_REBUILD" = "true" ]; then
            python gen_config.py --full --delete-sources --archives-out "$RUNNER_TEMP/archives.txt"
          else
            python gen_config.py --changes "$RUNNER_TEMP/changes.json" --archives-out "$RUNNER_TEMP/archives.txt"
          fi

      - name: Upload archives to release
        if: steps.changes.outputs.has_changes == 'true' || env.FULL_REBUILD == 'true'
        run: python scripts/publish_release.py upload --archives "$RUNNER_TEMP/archives.txt"

      # Pushed only after the upload, so assets.json never points at files
      # that aren't in the release yet.
      - name: Commit and push
        id: push
        if: steps.changes.outputs.has_changes == 'true' || env.FULL_REBUILD == 'true'
        run: |
          git config --global user.name 'Buildbot'
          git config --global user.email 'buildbot@users.noreply.github.com'
          git add assets.json last_versions.json scripts/last_tag.txt
          git commit -m "Update assets"
          if git push origin HEAD:main; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            # main moved during the run; the run queued by that push will
            # process everything since the last successful run, including this.
            echo "::warning::main changed during the run, leaving the update to the next queued run"
          fi

      - name: Remove orphaned archives from release
        if: steps.push.outputs.pushed == 'true'
        run: |
          if [ "$FULL_REBUILD" = "true" ]; then
            python scripts/publish_release.py prune --max-deletions 1000
          else
            python scripts/publish_release.py prune
          fi
